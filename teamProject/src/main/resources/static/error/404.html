<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지를 찾을 수 없습니다 - Yum Table</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* 얌테이블 커스텀 컬러 팔레트 */
        :root {
            --yum-dark-red: #7B2D26;
            --yum-beige: #D9C6A5;
            --yum-cream: #FDF6EC;
            --yum-dark-blue: #1C1C2A;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--yum-cream);
            color: var(--yum-dark-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .error-container {
            text-align: center;
            max-width: 500px;
        }
        .error-icon {
            font-size: 5rem;
            color: var(--yum-beige);
        }
        .error-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-top: 1rem;
        }
        .error-message {
            font-size: 1.1rem;
            color: #5a6a7b;
            margin-top: 1rem;
            margin-bottom: 2rem;
        }
        .btn-home {
            background-color: var(--yum-dark-red);
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        .btn-home:hover {
            background-color: #9c3a32;
            color: white;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <i class="bi bi-exclamation-triangle-fill"></i>
        </div>
        <h1 class="error-title">404 - Page Not Found</h1>
        <p class="error-message">
            요청하신 페이지가 존재하지 않거나, 주소가 변경되었을 수 있습니다.
            <br>
            입력하신 주소가 정확한지 다시 한번 확인해주세요.
        </p>
        <a href="/" class="btn btn-home">메인 페이지로 돌아가기</a>
    </div>
</body>
</html>
