plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.spring'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	
	// mysql-connector-java
	implementation("mysql:mysql-connector-java:8.0.28")
	// mybatis
	implementation("org.mybatis:mybatis:3.5.6")
	// mybatis-spring
	implementation("org.mybatis:mybatis-spring:1.3.1")
	// cglib
	implementation("cglib:cglib:2.2.2")
	
	// spring-context
	implementation("org.springframework:spring-context:5.3.22")
	// spring-beans
	implementation("org.springframework:spring-beans:5.3.22")
	// spring-webmvc
	implementation("org.springframework:spring-webmvc:5.3.22")
	// spring-jdbc
	implementation("org.springframework:spring-jdbc:5.3.22")
	// spring-core
	implementation("org.springframework:spring-core:5.3.22")
	// spring-aop
	implementation("org.springframework:spring-aop:5.3.22")
	// spring-tx
	implementation("org.springframework:spring-tx:5.3.22")
	
	// jakarta.servlet-api
	compileOnly("jakarta.servlet:jakarta.servlet-api:6.0.0")
	// jakarta.annotation-api
	implementation("jakarta.annotation:jakarta.annotation-api:2.1.1")
	// jakarta.servlet.jsp.jstl-api
	implementation("jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0")
	// jakarta.inject-api
	implementation("jakarta.inject:jakarta.inject-api:2.0.1")
	
	// aspectjrt
	runtimeOnly("org.aspectj:aspectjrt:1.9.19")
	// aspectjweaver
	runtimeOnly("org.aspectj:aspectjweaver:1.9.19")
	// aspectjtools
	implementation("org.aspectj:aspectjtools:1.9.19")
	// slf4j-api
	implementation("org.slf4j:slf4j-api:1.7.36")
	// slf4j-log4j12
	implementation("org.slf4j:slf4j-log4j12:1.7.36")
	// log4j
	implementation("log4j:log4j:1.2.17")
	// junit/junit
	testImplementation("junit:junit:4.12")
	// commons-io
	implementation("commons-io:commons-io:2.11.0")
	// commons-fileupload
	implementation("commons-fileupload:commons-fileupload:1.3.1")
	// commons-beanutils
	implementation("commons-beanutils:commons-beanutils:1.9.4")
	// commons-dbcp2
	implementation("org.apache.commons:commons-dbcp2:2.9.0")
	
	// jquery
	implementation("org.webjars:jquery:3.7.1")
	// thumbnailator
	implementation("net.coobird:thumbnailator:0.4.8")
	// json-lib
	implementation("net.sf.json-lib:json-lib:2.4")
	// ezmorph
	implementation("net.sf.ezmorph:ezmorph:1.0.6")
}

tasks.named('test') {
	useJUnitPlatform()
}
