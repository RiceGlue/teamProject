plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.spring'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
	google() // firebase
}

dependencies {
	// Spring Security & OAuth2 Client
	// 로그인, 권한 관리 등 보안 기능 & 외부 서비스를 이용한 thtuf fhrmdls OAuth 2.0 인증 구현
	// config의  SecurityConfig.java 파일이 보안과 관련된 옵션을 조정할 수 있습니다
	// tool/PasswordEncoderUtil.java 를 통하여 미리 데이터를 암호화 시켜볼 수 있습니다 (임시 비밀번호 생성 등 이용)
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	// 스프링 시큐리티 태그 라이브러리 (JSP용)
	implementation 'org.springframework.security:spring-security-taglibs'

	implementation 'org.springframework.boot:spring-boot-starter'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // (신규) Spring Boot Mail Starter 추가
    implementation 'org.springframework.boot:spring-boot-starter-mail'

	// DB
	implementation 'mysql:mysql-connector-java:8.0.28'
	implementation 'org.apache.commons:commons-dbcp2:2.9.0'
	//implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.2'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'

	// https://mvnrepository.com/artifact/io.portone/server-sdk
	implementation 'io.portone:server-sdk:0.19.2'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// JSP / Servlet 관련
	developmentOnly 'org.springframework.boot:spring-boot-devtools' //화면 변경 코드 시 귀찮은 서버 재시작을 줄이고 브라우저 캐시만 삭제하여 리로드
	compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
	implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'
	implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0'
	// JSTL 구현체
	implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'
	implementation 'jakarta.inject:jakarta.inject-api:2.0.1'
	//implementation 'org.springframework.boot:spring-boot-starter-web' //자체 로깅 충돌 방지
	implementation('org.springframework.boot:spring-boot-starter-web') {
	    exclude group: 'commons-logging', module: 'commons-logging'
	}
	implementation 'org.apache.tomcat.embed:tomcat-embed-jasper'       // JSP 컴파일러

	// 로깅 (Spring Boot 기본 logback 사용. slf4j-log4j12, log4j 제거)
//	implementation 'org.slf4j:slf4j-api:1.7.36' // 선택 사항 (이미 포함됨)

	// AspectJ
	runtimeOnly 'org.aspectj:aspectjrt:1.9.19'
	runtimeOnly 'org.aspectj:aspectjweaver:1.9.19'
	implementation 'org.aspectj:aspectjtools:1.9.19'

	// 공통 유틸
	implementation 'commons-io:commons-io:2.11.0'
	// (수정) 스프링 부트의 내장 파일 업로드 기능과 충돌하여 오류를 유발하므로 이 의존성을 제거합니다.
//	implementation 'commons-fileupload:commons-fileupload:1.3.1'
	implementation 'commons-beanutils:commons-beanutils:1.9.4'

	// 웹 관련
	implementation 'org.webjars:jquery:3.7.1'
	implementation 'net.coobird:thumbnailator:0.4.8'

	// JSON
//	implementation 'net.sf.json-lib:json-lib:2.4'
//	implementation 'net.sf.ezmorph:ezmorph:1.0.6'

	// JUnit4 Spring-boot-starter-test에 JUnit 5(jupiter)가 포함되어있음
//	testImplementation 'junit:junit:4.12'

	// Firebase Admin SDK


    // Jackson (종종 필요함)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.3'

    // Firebase Admin SDK 추가
    implementation 'com.google.firebase:firebase-admin:9.3.0' // 최신 버전

}
// **추가된 부분: Java 컴파일 시 -parameters 플래그 추가**
tasks.withType(JavaCompile) {
    options.compilerArgs.add("-parameters")
}
tasks.named('test') {
	useJUnitPlatform()
}

configurations.all {
    exclude group: 'commons-logging', module: 'commons-logging'
}
